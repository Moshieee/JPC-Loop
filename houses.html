<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata, shared stylesheet, and houses-only stylesheet. -->
    <title>Houses | JPC Loop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="houses.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <!-- Shared navigation for moving around JPC Loop. -->
    <header>
        <nav class="navbar">
            <h2 class="logo"><a href="index.html">JPC Loop</a></h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="">Feed</a></li>
                <li><a href="">News</a></li>
                <li><a href="houses.html">Houses</a></li>
                <li><a href="">Gallery</a></li>
                <li><a href="">Guidelines</a></li>
                <li><a class="signin" href="signin.html">Sign in</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Houses page content. -->
    <main class="houses-main">
        <!-- Grey heading band matching the reference layout. -->
        <section class="houses-heading">
            <h1>JPC Houses</h1>
        </section>

        <!-- House tiles use the banner files from images/houses; the banners already include their own text. -->
        <section class="houses-grid" aria-label="JPC house list">
            <div class="house-card">
                <img src="images/houses/Rice.png" alt="Rice house banner">
            </div>

            <div class="house-card">
                <img src="images/houses/Kanea.png" alt="Kanea house banner">
            </div>

            <div class="house-card">
                <img src="images/houses/La Salle.png" alt="La Salle house banner">
            </div>

            <div class="house-card">
                <img src="images/houses/McKenna.png" alt="McKenna house banner">
            </div>

            <div class="house-card">
                <img src="images/houses/MacKillop.png" alt="MacKillop house banner">
            </div>
        </section>
    </main>

</body>
</html>
