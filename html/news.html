<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata and stylesheet. -->
    <title>News | JPC Loop</title>
    <link rel="stylesheet" href="../style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="news">

    <!-- Header navigation shown at the top of the News page. -->
    <header>
        <nav class="navbar">
            <h2 class="logo"><a href="home.html"><img src="../images/jpcLoopLogo.png" alt="JPC Loop"></a></h2>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="feed.html">Feed</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="houses.html">Houses</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="guidelines.html">Guidelines</a></li>
                <li><a class="signin" href="signin.html">Sign in</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main News page content. -->
    <main class="news-main">

        <!-- Grey heading bar with the page title and add post button. -->
        <section class="news-heading">
            <h1>News</h1>
            <button class="add-post-button" id="toggle-post-form" type="button">Add post</button>
        </section>

        <div class="post-form-pannel" id="post-form-pannel">
                    <form class="post-form" id="post-form">
                        <label for="post-title">Post title</label>
                        <input class="post-title" id="post-title" type="text" placeholder="Enter post title">

                        <label for="post-description">Post description</label>
                        <textarea class="post-description" id="post-description" placeholder="Write your post"></textarea>

                        <button class="primary-button" type="submit">Post</button>
                    </form>
                </div>

        <!-- Placeholder news post area. -->
        <div class="news-list">

            <article class="news-post">
                <h2>Welcome to the JPC Loop News</h2>
                <p>News updates will appear here once the news feature is connected.</p>
            </article>

        </div>

    </main>

<script src="../js/addPost.js"></script>

</body>

</html>
